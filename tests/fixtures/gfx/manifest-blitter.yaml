# A manifest in the shape a project writes one: m68k-dual's blitter command, transcribed from
# the board driver's do_blit, plus circus's char layout for the named-format cases. `m68k` is the
# system the suite's session doubles run.
schema: 1
systems: [m68k, m68k-dual]

formats:
  page_512x512x8:
    layout:
      width: 512
      height: 512
      planes: 8
      planeoffset: '{ 0, 1, 2, 3, 4, 5, 6, 7 }'
      xoffset: '{ STEP512(0,8) }'
      yoffset: '{ STEP512(0,4096) }'
      charincrement: 512*512*8
    status: declared
    source: m68k-dual.cpp texlayout
  charlayout:
    layout:
      width: 8
      height: 8
      planes: 1
      planeoffset: [0]
      xoffset: '{ 0, 1, 2, 3, 4, 5, 6, 7 }'
      yoffset: '{ 0*8, 1*8, 2*8, 3*8, 4*8, 5*8, 6*8, 7*8 }'
      charincrement: 8*8
    status: declared
    source: circus.cpp charlayout

assets:
  pages:
    format: page_512x512x8
    tag: gfx1
    palette: palette
    wrap: true
    status: declared
    source: m68k-dual.cpp do_blit, the source wraps inside its page

commands:
  blit:
    block: {address: 0x700000, words: 16, word_bytes: 2, status: declared, source: 'm68k-dual.cpp main_map, blit_w'}
    fire: {word: 15, value: 0xffff, status: declared, source: m68k-dual.cpp blit_w}
    asset: pages
    fields:
      dest_x:
        parts:
          - {word: 0, mask: 0x00ff}
          - {word: 7, mask: 0x0040, at: 8}
        status: proved
        source: the known-answer check of the boxes against the screen
      dest_y:
        parts:
          - {word: 2, mask: 0x00ff}
          - {word: 7, mask: 0x0080, at: 8}
        status: declared
        source: m68k-dual.cpp do_blit
      dest_x_end:
        parts:
          - {word: 1, mask: 0x00ff}
          - {word: 9, mask: 0x0004, at: 8}
        status: declared
        source: m68k-dual.cpp do_blit
      dest_y_end:
        parts:
          - {word: 3, mask: 0x00ff}
          - {word: 9, mask: 0x0008, at: 8}
        status: declared
        source: m68k-dual.cpp do_blit
      dest_dir_x: {parts: [{word: 7, mask: 0x0001}], asserted: 1, status: declared, source: m68k-dual.cpp do_blit}
      dest_dir_y: {parts: [{word: 7, mask: 0x0002}], asserted: 1, status: declared, source: m68k-dual.cpp do_blit}
      source_x:
        parts:
          - {word: 0, mask: 0xff00}
          - {word: 6, mask: 0x0100, at: 8}
        status: declared
        source: m68k-dual.cpp do_blit
      source_y:
        parts:
          - {word: 2, mask: 0xff00}
          - {word: 6, mask: 0x0200, at: 8}
        add: 1
        status: declared
        source: m68k-dual.cpp do_blit, v_bias at 1:1
      source_tile:
        parts:
          - {word: 6, mask: 0xfc00}
        status: declared
        source: m68k-dual.cpp do_blit
      source_dir_x: {parts: [{word: 8, mask: 0x4000}], asserted: 1, status: declared, source: m68k-dual.cpp do_blit}
      source_dir_y: {parts: [{word: 8, mask: 0x8000}], asserted: 1, status: declared, source: m68k-dual.cpp do_blit}
      plane: {parts: [{word: 7, mask: 0x0010}], status: declared, source: m68k-dual.cpp do_blit}
      reads_source: {parts: [{word: 7, mask: 0x0004}], asserted: 1, status: human, source: the family's register notes}
    flags:
      writes_index_0: {parts: [{word: 7, mask: 0x0008}], status: declared, source: wheelfir.cpp do_blit}
      drawing_low_half: {parts: [{word: 8, mask: 0x0020}], status: declared, source: 'm68k-dual.cpp do_blit, flip_page'}
      scroll_x:
        parts:
          - {word: 10, mask: 0x00ff}
          - {word: 8, mask: 0x0040, at: 8}
        status: declared
        source: m68k-dual.cpp screen_update
      scroll_y:
        parts:
          - {word: 11, mask: 0x00ff}
          - {word: 8, mask: 0x0080, at: 8}
        status: declared
        source: m68k-dual.cpp scanline_timer_callback
    planes:
      - name: fg
        when: 0
        order: 1
        origin_y: {field: drawing_low_half, scale: -256, add: 256}
        page: drawing_low_half
        width: 512
        height: 512
        status: declared
        source: m68k-dual.cpp flip_page and screen_update
      - name: bg
        when: 1
        order: 0
        origin_x: {field: scroll_x}
        origin_y: {field: scroll_y}
        width: 512
        height: 512
        status: declared
        source: m68k-dual.cpp screen_update

palette_ports:
  ramdac:
    palette: palette
    index_port: 0x720001
    data_port: 0x720003
    order: [r, g, b]
    component_bits: 8
    auto_increment: true
    status: declared
    source: m68k-dual.cpp main_map (index_w, pal_w) and ramdac_map (ramdac_rgb888_w)
