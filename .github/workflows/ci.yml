# The unit tiers on GitHub's Linux runners; the live tiers need an emulator and a display, and run
# on the maintainers' macOS and Windows hosts. Started by hand until the repositories are public.
name: CI

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  battery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Every `uv run` refuses a lock that no longer matches pyproject.toml instead of re-resolving.
    env:
      UV_LOCKED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        timeout-minutes: 5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version: "24"
      # The duplication baseline was written by this jscpd; another release counts clones differently.
      - run: npm install --global jscpd@5.2.1 && jscpd --version
        timeout-minutes: 5
      # The Lua doubles run MAME's Lua through a host interpreter, and the stub owner reads lsof.
      # luac5.4, StyLua and luacheck judge the scripts under src/scry_mame/lua/ (tests/test_lua_scripts.py).
      - name: lua, lsof, StyLua and luacheck
        timeout-minutes: 8
        run: |
          for _ in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4 liblua5.4-dev luarocks lsof \
              && break
            sleep 10
          done
          command -v lua5.4 luac5.4 luarocks lsof || { echo "apt-get could not install them"; exit 1; }
          sudo ln -sf "$(command -v lua5.4)" /usr/local/bin/lua && lua -v
          sudo luarocks --lua-version=5.4 install luacheck 1.2.0-1 && luacheck --version
          curl -sSfL -o /tmp/stylua.zip \
            https://github.com/JohnnyMorganz/StyLua/releases/download/v2.6.0/stylua-linux-x86_64.zip
          echo "a485f72bbfa22e4642e77a84b5edc2611a5cab7477b34e2e709dd8f78e919895  /tmp/stylua.zip" \
            | sha256sum -c -
          sudo unzip -o -q /tmp/stylua.zip -d /usr/local/bin && stylua --version
      - run: uv sync
        timeout-minutes: 5
      - run: uv run ruff check .
      - run: uv run mypy --strict .
      - run: uv run mypy --strict --platform win32 .
      # The coverage floor counts every platform branch of the tree as macOS runs it, so it is
      # judged there; here the suite judges behaviour.
      - run: uv run pytest -q --no-cov -rs
      - run: bash .githooks/pre-commit-test.sh
      - run: uv run python -m scry_core.hook
