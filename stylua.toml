# The Lua under src/scry_mame/lua/ is sent to MAME's console as one line, so its comments are
# dropped on the way (lua_source.py) and only the code's own width matters here.
column_width = 100
line_endings = "Unix"
indent_type = "Spaces"
indent_width = 2
quote_style = "AutoPreferDouble"
call_parentheses = "Always"
